<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квест: Северный флот ВОВ · Интерактивная карта</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }
        .map-container {
            width: 1400px;
            max-width: 95vw;
            background: #070b12;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 200, 100, 0.2);
            overflow: hidden;
            border: 1px solid #4a5e7a;
            position: relative;
        }
        #map {
            height: 720px;
            width: 100%;
            background: #0a1020;
        }
        .legend-bar {
            background: #0b0f18;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
            color: #eef4ff;
            border-top: 1px solid #2a3a4a;
            font-size: 13px;
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .line-color {
            width: 40px;
            height: 3px;
            border-radius: 3px;
        }
        .line-color.convoy { background: #ffaa44; box-shadow: 0 0 4px #ffaa66; }
        .line-color.battle { background: #ff5e5e; box-shadow: 0 0 4px #ff5e5e; }
        .line-color.patrol { background: #5aa9dd; box-shadow: 0 0 4px #5aa9dd; }
        .badge {
            background: #1e2a3a;
            padding: 5px 14px;
            border-radius: 40px;
            color: #ffecb3;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ffaa55;
            margin-left: auto;
        }
        .speed-control {
            background: #1a2533;
            padding: 4px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }
        .speed-control button {
            background: #ffaa44;
            border: none;
            color: #1a1f2a;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .speed-control button:hover {
            background: #ffcc66;
            transform: scale(1.02);
        }
        .speed-control span {
            color: #ffaa66;
            font-weight: bold;
        }

        /* КВЕСТ-ПАНЕЛЬ */
        .quest-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 320px;
            background: rgba(10, 16, 26, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border-left: 4px solid #ffaa44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 18px 20px;
            color: #f0f3fa;
            z-index: 1000;
            font-size: 14px;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .quest-panel h3 {
            font-size: 1.2rem;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #ffaa6655;
            padding-bottom: 6px;
        }
        .quest-progress {
            font-size: 12px;
            background: #1e2a36;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 30px;
            margin-bottom: 12px;
        }
        .quest-question {
            font-weight: 600;
            margin: 12px 0 8px 0;
            font-size: 1rem;
            line-height: 1.4;
            color: #ffdd99;
        }
        .quest-input {
            width: 100%;
            background: #0f1822;
            border: 1px solid #4a5e7a;
            padding: 10px 14px;
            border-radius: 40px;
            color: #eef4ff;
            font-size: 13px;
            margin: 8px 0;
            outline: none;
            transition: 0.2s;
        }
        .quest-input:focus {
            border-color: #ffaa66;
            box-shadow: 0 0 6px #ffaa66;
        }
        .quest-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .quest-btn {
            background: #2a3a48;
            border: none;
            padding: 8px 0;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            font-size: 13px;
        }
        .quest-btn.primary {
            background: #ffaa44;
            color: #1a1f2a;
        }
        .quest-btn.primary:hover {
            background: #ffcc66;
        }
        .quest-btn:hover {
            background: #3a4e60;
        }
        .quest-feedback {
            font-size: 12px;
            margin-top: 10px;
            padding: 6px;
            border-radius: 16px;
            background: #00000055;
            text-align: center;
        }
        .quest-hint {
            font-size: 11px;
            color: #bbccff;
            margin-top: 8px;
            border-top: 1px dashed #4a6a8a;
            padding-top: 8px;
            cursor: help;
        }
        .reset-quest {
            background: none;
            border: 1px solid #ffaa66;
            color: #ffaa66;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 12px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-quest:hover {
            background: #ffaa6622;
        }

        .leaflet-popup-content-wrapper {
            background: #1e2a36;
            border-left: 4px solid #ffaa44;
            border-radius: 12px;
        }
        .leaflet-popup-content {
            color: #eef2ff;
            font-size: 13px;
        }
        .ship-marker-moving {
            background: transparent;
            border: none;
            transition: all 0.05s linear;
        }
        @keyframes shipPulse {
            0% { filter: drop-shadow(0 0 2px #ffaa44); transform: scale(1); }
            100% { filter: drop-shadow(0 0 8px #ffaa66); transform: scale(1.05); }
        }
        .ship-icon {
            animation: shipPulse 1.5s infinite alternate;
        }
        @media (max-width: 700px) {
            .quest-panel { width: 260px; right: 10px; bottom: 70px; padding: 14px; }
            .legend-bar { gap: 12px; font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="map-container">
    <div id="map"></div>
    <div class="legend-bar">
        <div class="legend-item"><span class="line-color convoy"></span> Маршруты конвоев</div>
        <div class="legend-item"><span class="line-color battle"></span> Боевые походы</div>
        <div class="legend-item"><span class="line-color patrol"></span> Патрули СФ</div>
        <div class="speed-control">
            <span>⚡ Скорость анимации:</span>
            <button id="speedDown">-</button>
            <span id="speedValue">1.0x</span>
            <button id="speedUp">+</button>
        </div>
        <div class="badge"><i>⚓</i> 1941–1945 · Северный флот</div>
    </div>
    <!-- Квест-панель -->
    <div class="quest-panel" id="questPanel">
        <h3>⚓ КВЕСТ: СЕВЕРНЫЙ ФЛОТ</h3>
        <div class="quest-progress" id="questProgress">Вопрос 1 / 7</div>
        <div class="quest-question" id="questQuestion">Загрузка...</div>
        <input type="text" id="questAnswerInput" class="quest-input" placeholder="Введите ответ... (можно кликнуть по объекту на карте)" autocomplete="off">
        <div class="quest-buttons">
            <button id="submitAnswerBtn" class="quest-btn primary">✅ Ответить</button>
            <button id="hintBtn" class="quest-btn">💡 Подсказка</button>
        </div>
        <div id="questFeedback" class="quest-feedback">🔍 Кликайте на базы, маршруты и корабли — ответ подставится сам!</div>
        <div class="quest-hint" id="dynamicHint">✨ Нажмите "Подсказка"</div>
        <button id="resetQuestBtn" class="reset-quest">⟳ Начать квест заново</button>
    </div>
</div>

<script>
    (function() {
        // ========== ИНИЦИАЛИЗАЦИЯ КАРТЫ ==========
        const map = L.map('map', {
            center: [69.05, 35.6],
            zoom: 7,
            zoomControl: true,
            fadeAnimation: true
        });
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CartoDB',
            subdomains: 'abcd',
            maxZoom: 12
        }).addTo(map);
        
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let animationSpeed = 1.0;
        let activeAnimations = [];
        
        // ========== КВЕСТ: МАССИВ ВОПРОСОВ ==========
        const questData = [
            { text: "Какая база была ГЛАВНОЙ базой Северного флота в годы ВОВ?", answer: "полярный", hint: "Кликните на базу в Кольском заливе, которая в попапе указана как 'Главная база Северного флота'." },
            { text: "Какой конвой получил название 'трагедия конвоя' в июле 1942 года?", answer: "pq-17", hint: "Найдите маршрут конвоя с красноватой линией и текстом 'PQ-17 (июль 1942) · трагедия конвоя'." },
            { text: "Название подводной лодки, которая атаковала линкор 'Тирпиц' 5 июля 1942?", answer: "к-21", hint: "Ищите корабль с символом 🐋 или маркер события с текстом 'Атака К-21'." },
            { text: "Какой эсминец совершил боевой поход и атаковал вражеский конвой в апреле 1942?", answer: "гремящий", hint: "Обратите внимание на корабль с символом ⚔️, его маршрут красного цвета." },
            { text: "Какой порт-герой был конечной точкой большинства арктических конвоев?", answer: "мурманск", hint: "Кликните на один из крупных портов на карте, отмеченный якорем." },
            { text: "Название острова, где находились береговые батареи и гарнизон (есть маркер с иконкой 🏝️)?", answer: "кильдин", hint: "Маркер острова в Кольском заливе, попап 'о. Кильдин'." },
            { text: "Сторожевой корабль, нёсший противолодочный дозор в 1943–1944 годах (синяя линия)?", answer: "смерч", hint: "Ищите патрульный маршрут с текстом 'Противолодочный дозор · 1943-1944'." }
        ];
        
        let currentQuestionIndex = 0;
        let completed = new Array(questData.length).fill(false);
        let gameActive = true;
        
        // Элементы UI квеста
        const questProgressEl = document.getElementById('questProgress');
        const questQuestionEl = document.getElementById('questQuestion');
        const questAnswerInput = document.getElementById('questAnswerInput');
        const questFeedback = document.getElementById('questFeedback');
        const dynamicHintEl = document.getElementById('dynamicHint');
        const submitBtn = document.getElementById('submitAnswerBtn');
        const hintBtn = document.getElementById('hintBtn');
        const resetBtn = document.getElementById('resetQuestBtn');
        
        // Обновление UI вопроса
        function updateQuestUI() {
            if (currentQuestionIndex >= questData.length) {
                // игра пройдена
                questQuestionEl.textContent = "🏆 ПОЗДРАВЛЯЕМ! 🏆\nВы ответили на все вопросы о Северном флоте!";
                questProgressEl.textContent = "Квест завершён!";
                questAnswerInput.disabled = true;
                submitBtn.disabled = true;
                hintBtn.disabled = true;
                questFeedback.innerHTML = "✨ Вы настоящий знаток истории Северного флота! ✨";
                dynamicHintEl.textContent = "🎉 Благодарим за прохождение! Обновите страницу для новой игры.";
                return;
            }
            const q = questData[currentQuestionIndex];
            questProgressEl.textContent = `Вопрос ${currentQuestionIndex+1} / ${questData.length}`;
            questQuestionEl.textContent = q.text;
            questAnswerInput.value = '';
            questAnswerInput.disabled = false;
            submitBtn.disabled = false;
            hintBtn.disabled = false;
            questFeedback.innerHTML = "💡 Кликните по объекту на карте — ответ вставится автоматически!";
            dynamicHintEl.innerHTML = `💬 Подсказка: ${q.hint}`;
        }
        
        // Проверка ответа
        function checkAnswer() {
            if (!gameActive) return;
            if (currentQuestionIndex >= questData.length) {
                questFeedback.innerHTML = "Квест уже завершён! Нажмите 'Начать заново'";
                return;
            }
            const userAnswerRaw = questAnswerInput.value.trim().toLowerCase();
            const correctAnswer = questData[currentQuestionIndex].answer;
            if (userAnswerRaw === correctAnswer || userAnswerRaw === correctAnswer.replace(/-/g, '') || 
                (correctAnswer === "полярный" && userAnswerRaw === "полярный") ||
                (correctAnswer === "pq-17" && (userAnswerRaw === "pq17" || userAnswerRaw === "pq 17")) ||
                (correctAnswer === "к-21" && (userAnswerRaw === "к21" || userAnswerRaw === "к 21"))) {
                // Правильно!
                completed[currentQuestionIndex] = true;
                questFeedback.innerHTML = "✅ ВЕРНО! Отличная работа! Переходим к следующему вопросу.";
                currentQuestionIndex++;
                updateQuestUI();
                // если после обновления игра завершена, показываем финал
                if (currentQuestionIndex >= questData.length) {
                    questFeedback.innerHTML = "🎉 Вы завершили квест! Спасибо за внимание к истории Северного флота! 🎉";
                }
            } else {
                questFeedback.innerHTML = "❌ Неправильно. Попробуйте ещё раз или кликните по объекту на карте для подсказки.";
            }
        }
        
        // Сброс игры
        function resetQuest() {
            currentQuestionIndex = 0;
            completed.fill(false);
            gameActive = true;
            questAnswerInput.disabled = false;
            submitBtn.disabled = false;
            hintBtn.disabled = false;
            updateQuestUI();
            questFeedback.innerHTML = "🔄 Квест перезапущен! Исследуйте карту и находите ответы.";
        }
        
        // ========== СИСТЕМА ПОДСТАНОВКИ ОТВЕТОВ ПРИ КЛИКЕ НА ОБЪЕКТЫ ==========
        // Словарь: для каждого объекта на карте (маркер, линия) храним ключевое слово-ответ
        // Чтобы при клике вставлять в поле ввода правильный вариант для ТЕКУЩЕГО вопроса,
        // но проще: если кликнутый объект имеет answerKey, то вставляем его в поле, но только если он соответствует ожидаемому?
        // Сделаем умнее: при клике смотрим на answerKey объекта, и если этот answerKey совпадает с ответом на ТЕКУЩИЙ вопрос (или содержит его),
        // то вставляем правильный ответ (каноничный). Иначе просто показываем сообщение, что это не относится к текущему вопросу.
        // Это поможет игроку целенаправленно искать.
        
        function registerClickableObject(leafletObject, answerKey, displayName = '') {
            if (!leafletObject) return;
            leafletObject.on('click', function(e) {
                if (currentQuestionIndex >= questData.length) {
                    questFeedback.innerHTML = "Квест пройден! Нажмите 'Начать заново' для новой игры.";
                    return;
                }
                const currentCorrectAnswer = questData[currentQuestionIndex].answer;
                // сравниваем answerKey с ожидаемым ответом (игнорируем регистр, дефисы)
                const normalizedKey = answerKey.toString().toLowerCase().replace(/[-\s]/g, '');
                const normalizedCorrect = currentCorrectAnswer.toLowerCase().replace(/[-\s]/g, '');
                if (normalizedKey === normalizedCorrect) {
                    // Вставляем каноничный ответ (как в массиве) в поле ввода
                    questAnswerInput.value = questData[currentQuestionIndex].answer;
                    questFeedback.innerHTML = `🔍 Объект «${displayName || answerKey}» связан с вопросом! Нажмите «Ответить».`;
                } else {
                    questFeedback.innerHTML = `ℹ️ Вы кликнули на «${displayName || answerKey}». Это не относится к текущему вопросу. Попробуйте другой объект (подсказка: ${questData[currentQuestionIndex].hint.substring(0, 60)}...)`;
                }
                // небольшой эффект подсветки (опционально)
                if (leafletObject.setStyle && leafletObject.setStyle) {
                    const originalColor = leafletObject.options.color;
                    leafletObject.setStyle({ color: '#ffdd88', weight: (leafletObject.options.weight || 2)+2 });
                    setTimeout(() => { leafletObject.setStyle({ color: originalColor, weight: leafletObject.options.weight }); }, 400);
                }
            });
        }
        
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function formatPopup(title, desc, extra = '') {
            return `<strong style="color:#ffcd7e;">${title}</strong><br>${desc}${extra ? '<br><span style="color:#aac7e0;">' + extra + '</span>' : ''}`;
        }
        
        // Сохраняем все кликабельные объекты для регистрации
        let allClickableObjects = [];
        
        // Добавление маркеров баз + регистрация для квеста
        function addBaseMarker(lat, lng, title, desc, answerKey) {
            const icon = L.divIcon({
                html: `<div style="background:#d98f2b; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #ffdd99; box-shadow:0 0 12px #ffb347;"><span style="font-size:15px;">⚓</span></div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            const marker = L.marker([lat, lng], { icon }).addTo(map);
            marker.bindPopup(formatPopup(title, desc, 'База СФ'));
            if (answerKey) {
                registerClickableObject(marker, answerKey, title);
            }
            return marker;
        }
        
        // ========== АНИМАЦИЯ КОРАБЛЕЙ ==========
        class AnimatedShip {
            constructor(points, options) {
                this.points = points;
                this.shipSymbol = options.shipSymbol || '🚢';
                this.shipName = options.shipName || 'Корабль';
                this.color = options.color || '#ffaa44';
                this.speed = options.speed || 0.002;
                this.lineWeight = options.lineWeight || 3;
                this.dashArray = options.dashArray || null;
                this.popupText = options.popupText || '';
                this.answerKey = options.answerKey || null;   // ключ для квеста
                this.marker = null;
                this.progress = Math.random();
                this.active = true;
                
                // Рисуем линию маршрута
                this.polyline = L.polyline(points, {
                    color: this.color,
                    weight: this.lineWeight,
                    opacity: 0.85,
                    dashArray: this.dashArray,
                    lineCap: 'round'
                }).addTo(map);
                
                if (this.popupText) {
                    this.polyline.bindPopup(this.popupText);
                }
                // Регистрируем клик по линии для квеста
                if (this.answerKey) {
                    registerClickableObject(this.polyline, this.answerKey, this.shipName);
                }
                
                this.updateMarker();
            }
            
            getPositionAtProgress(progress) {
                if (progress >= 1) return this.points[this.points.length - 1];
                if (progress <= 0) return this.points[0];
                const totalSegments = this.points.length - 1;
                const segmentProgress = progress * totalSegments;
                const segmentIndex = Math.floor(segmentProgress);
                const segmentT = segmentProgress - segmentIndex;
                if (segmentIndex >= totalSegments) return this.points[totalSegments];
                const p1 = this.points[segmentIndex];
                const p2 = this.points[segmentIndex + 1];
                return [ p1[0] + (p2[0] - p1[0]) * segmentT, p1[1] + (p2[1] - p1[1]) * segmentT ];
            }
            
            updateMarker() {
                const pos = this.getPositionAtProgress(this.progress);
                if (!pos) return;
                const icon = L.divIcon({
                    html: `<div style="font-size: 26px; filter: drop-shadow(0 0 5px ${this.color}); text-shadow: 0 0 3px black; animation: shipPulse 1s infinite alternate;">${this.shipSymbol}</div>`,
                    className: 'ship-marker-moving',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });
                if (this.marker) {
                    this.marker.setLatLng(pos);
                    this.marker.setIcon(icon);
                } else {
                    this.marker = L.marker(pos, { icon }).addTo(map);
                    this.marker.bindPopup(formatPopup(this.shipName, `Маршрут: ${this.popupText || 'боевое патрулирование'}`, 'в движении'));
                    // Добавим возможность клика по маркеру корабля (для квеста)
                    if (this.answerKey) {
                        registerClickableObject(this.marker, this.answerKey, this.shipName);
                    }
                }
            }
            
            update(deltaSpeed) {
                if (!this.active) return;
                this.progress += this.speed * deltaSpeed;
                if (this.progress >= 1) this.progress = 0;
                this.updateMarker();
            }
            
            remove() {
                this.active = false;
                if (this.marker) map.removeLayer(this.marker);
                if (this.polyline) map.removeLayer(this.polyline);
            }
        }
        
        // ========== ДОБАВЛЕНИЕ БАЗ С КЛЮЧАМИ ==========
        addBaseMarker(69.025, 33.069, 'Полярный', 'Главная база Северного флота', 'полярный');
        addBaseMarker(69.083, 33.416, 'Североморск (Ваенга)', 'Штаб флота, аэродром', 'североморск');
        addBaseMarker(68.970, 33.075, 'Мурманск', 'Город-герой, порт приёма конвоев', 'мурманск');
        addBaseMarker(69.200, 33.450, 'Гремиха', 'База подлодок', 'гремиха');
        addBaseMarker(66.550, 33.100, 'Кандалакша', 'Тыловой порт', 'кандалакша');
        
        // ========== АНИМИРОВАННЫЕ КОРАБЛИ С answerKey ДЛЯ КВЕСТА ==========
        const ships = [];
        
        ships.push(new AnimatedShip([[74.5,19.0],[72.2,27.5],[70.5,33.0],[69.2,35.2]], { shipSymbol:'🛳️', shipName:'Транспорт "Ланкастер"', color:'#ffaa44', speed:0.0015, lineWeight:4, dashArray:'10,8', popupText:'Конвой PQ-12 (март 1942)', answerKey:'pq-12' }));
        ships.push(new AnimatedShip([[74.5,18.0],[73.2,28.5],[71.5,42.0],[68.8,47.5]], { shipSymbol:'⚓', shipName:'Транспорт "Ocean Voice"', color:'#ffaa66', speed:0.0012, lineWeight:4, dashArray:'12,10', popupText:'PQ-17 (июль 1942) · трагедия конвоя', answerKey:'pq-17' }));
        ships.push(new AnimatedShip([[72.0,30.5],[69.8,33.2],[69.2,34.0]], { shipSymbol:'🚢', shipName:'Союзный конвой JW-55', color:'#ffbb66', speed:0.0018, lineWeight:3.5, dashArray:'10,8', popupText:'Маршрут конвоев из Исландии', answerKey:'jw-55' }));
        ships.push(new AnimatedShip([[71.2,24.0],[70.5,29.0],[69.4,34.5]], { shipSymbol:'⛴️', shipName:'Танкер "British Pride"', color:'#ffaa77', speed:0.0014, lineWeight:3.5, dashArray:'12,12', popupText:'Конвой RA-55A', answerKey:'ra-55a' }));
        ships.push(new AnimatedShip([[69.5,33.0],[71.2,31.5],[72.0,28.5]], { shipSymbol:'⚔️', shipName:'Эсминец "Гремящий"', color:'#ff5e5e', speed:0.0022, lineWeight:5, dashArray:null, popupText:'Боевой поход · атака на вражеский конвой (апрель 1942)', answerKey:'гремящий' }));
        ships.push(new AnimatedShip([[69.2,33.5],[71.0,27.2],[72.3,21.8]], { shipSymbol:'🐋', shipName:'ПЛ К-21 (капитан Лунин)', color:'#ff6b6b', speed:0.0019, lineWeight:4.5, dashArray:null, popupText:'Торпедная атака на линкор "Тирпиц" · 5 июля 1942', answerKey:'к-21' }));
        ships.push(new AnimatedShip([[69.4,33.8],[68.8,37.5],[68.1,39.5],[67.4,41.2]], { shipSymbol:'⛴️', shipName:'СКР "Смерч"', color:'#5aa9dd', speed:0.0016, lineWeight:3, dashArray:'6,8', popupText:'Противолодочный дозор · 1943-1944', answerKey:'смерч' }));
        ships.push(new AnimatedShip([[69.3,34.0],[70.5,36.0],[71.8,38.0]], { shipSymbol:'⛴️', shipName:'Сторожевик "Буран"', color:'#5aa9dd', speed:0.0017, lineWeight:3, dashArray:'6,8', popupText:'Поиск подлодок противника', answerKey:'буран' }));
        ships.push(new AnimatedShip([[67.5,43.0],[66.8,44.5],[66.0,43.0]], { shipSymbol:'⚓', shipName:'Тральщик Т-117', color:'#6cace4', speed:0.0013, lineWeight:3, dashArray:'5,7', popupText:'Патруль Беломорской флотилии', answerKey:'т-117' }));
        ships.push(new AnimatedShip([[69.15,33.3],[69.25,34.2],[69.2,35.0],[68.95,34.5],[69.05,33.9]], { shipSymbol:'⚡', shipName:'Торпедный катер ТКА-12', color:'#88ccff', speed:0.0025, lineWeight:2.5, dashArray:'4,10', popupText:'Связной катер', answerKey:'тка-12' }));
        ships.push(new AnimatedShip([[71.0,32.5],[70.2,35.2],[69.5,34.3]], { shipSymbol:'🔥', shipName:'Эсминец "Сокрушительный"', color:'#ff5252', speed:0.0020, lineWeight:4, dashArray:null, popupText:'Атака на PQ-13 (март 1942)', answerKey:'сокрушительный' }));
        ships.push(new AnimatedShip([[68.2,39.0],[67.5,41.0],[66.8,42.5]], { shipSymbol:'🏥', shipName:'Госпитальное судно "Антон Чехов"', color:'#f4a261', speed:0.0011, lineWeight:3, dashArray:'8,8', popupText:'Эвакуация раненых', answerKey:'антон чехов' }));
        
        // Дополнительные маркеры событий с регистрацией для квеста
        const eventIcon = L.divIcon({ html: `<div style="background:#e34d4d; width:14px; height:14px; border-radius:14px; border:2px solid white; box-shadow:0 0 10px red;"></div>`, iconSize: [14,14] });
        const markerAttack = L.marker([71.5,28.0], { icon: eventIcon }).addTo(map).bindPopup(formatPopup('Бой с эсминцами', 'Потоплен транспорт "Кведлинбург" (май 1942)'));
        registerClickableObject(markerAttack, 'бой', 'Бой с эсминцами');
        const markerTirpitz = L.marker([72.2,24.5], { icon: eventIcon }).addTo(map).bindPopup(formatPopup('Атака К-21', 'Торпедная атака по линкору "Тирпиц"', '5 июля 1942'));
        registerClickableObject(markerTirpitz, 'к-21', 'Атака К-21');
        
        const islandIcon = L.divIcon({ html: '🏝️', iconSize: [24,24] });
        const islandMarker = L.marker([69.335,34.105], { icon: islandIcon }).addTo(map).bindPopup(formatPopup('о. Кильдин', 'Гарнизон, береговые батареи'));
        registerClickableObject(islandMarker, 'кильдин', 'о. Кильдин');
        
        // Круги также можно сделать кликабельными
        const circleKola = L.circle([69.2,34.8], { color:'#ffbb66', weight:1.5, fillColor:'#335588', fillOpacity:0.12, radius:50000 }).addTo(map).bindPopup('Кольский залив — главная база СФ');
        registerClickableObject(circleKola, 'полярный', 'Кольский залив (главная база)');
        
        const circleOps = L.circle([71.2,28.5], { color:'#ff8855', weight:1, fillColor:'#446688', fillOpacity:0.08, radius:70000 }).addTo(map).bindPopup('Район активных конвойных операций');
        registerClickableObject(circleOps, 'конвой', 'Район конвоев');
        
        // Анимированные мигающие зоны (дополнительно)
        const blinkPoints = [
            { lat: 69.33, lng: 34.10, title: 'Кольский залив', desc: 'Главная база СФ', key: 'полярный' },
            { lat: 71.9, lng: 29.5, title: 'Район атаки Тирпица', desc: 'Активные боевые действия', key: 'к-21' }
        ];
        blinkPoints.forEach(p => {
            const marker = L.circleMarker([p.lat, p.lng], { radius:8, color:'#ffaa66', weight:2, fillColor:'#ff6644', fillOpacity:0.6 }).addTo(map).bindPopup(formatPopup(p.title, p.desc, 'активная зона'));
            registerClickableObject(marker, p.key, p.title);
            let blinkState = true;
            setInterval(() => {
                blinkState = !blinkState;
                marker.setStyle({ fillOpacity: blinkState ? 0.8 : 0.2, radius: blinkState ? 9 : 6, color: blinkState ? '#ffaa77' : '#ff8866' });
            }, 700);
        });
        
        // ========== ЗАПУСК АНИМАЦИИ ==========
        let lastTimestamp = 0;
        let animationId = null;
        function animateShips(currentTime) {
            if (!lastTimestamp) { lastTimestamp = currentTime; animationId = requestAnimationFrame(animateShips); return; }
            const delta = Math.min(0.05, (currentTime - lastTimestamp) / 1000);
            if (delta > 0) {
                const speedFactor = animationSpeed * 60 * delta;
                ships.forEach(ship => { if(ship.active) ship.update(speedFactor); });
            }
            lastTimestamp = currentTime;
            animationId = requestAnimationFrame(animateShips);
        }
        animateShips(0);
        
        // Управление скоростью
        const speedDownBtn = document.getElementById('speedDown');
        const speedUpBtn = document.getElementById('speedUp');
        const speedValueSpan = document.getElementById('speedValue');
        speedDownBtn.addEventListener('click', () => { animationSpeed = Math.max(0.3, animationSpeed - 0.1); speedValueSpan.textContent = animationSpeed.toFixed(1)+'x'; });
        speedUpBtn.addEventListener('click', () => { animationSpeed = Math.min(2.5, animationSpeed + 0.1); speedValueSpan.textContent = animationSpeed.toFixed(1)+'x'; });
        
        // Инициализация квеста
        updateQuestUI();
        submitBtn.addEventListener('click', checkAnswer);
        hintBtn.addEventListener('click', () => { if(currentQuestionIndex < questData.length) dynamicHintEl.innerHTML = `💡 Подсказка: ${questData[currentQuestionIndex].hint}`; });
        resetBtn.addEventListener('click', resetQuest);
        
        // Декоративные элементы
        L.control.scale({ imperial: false, metric: true, position: 'bottomright' }).addTo(map);
        const textIcon = L.divIcon({ html: '<div style="background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); color:#ffecb3; padding:6px 16px; border-radius:32px; font-weight:bold; border:1px solid #ffbb77;">⚓ Кольский полуостров · Северный флот</div>', iconSize: [220,36], iconAnchor: [110,18] });
        L.marker([67.8,36.0], { icon: textIcon, interactive: false }).addTo(map);
        
        setTimeout(() => map.invalidateSize(), 100);
    })();
</script>
