<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Северный флот ВОВ · Кольский полуостров · Анимация движения кораблей</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }
        .map-container {
            width: 1400px;
            max-width: 95vw;
            background: #070b12;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 200, 100, 0.2);
            overflow: hidden;
            border: 1px solid #4a5e7a;
        }
        #map {
            height: 720px;
            width: 100%;
            background: #0a1020;
        }
        .legend-bar {
            background: #0b0f18;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
            color: #eef4ff;
            border-top: 1px solid #2a3a4a;
            font-size: 13px;
            font-weight: 500;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .line-color {
            width: 40px;
            height: 3px;
            border-radius: 3px;
        }
        .line-color.convoy { background: #ffaa44; box-shadow: 0 0 4px #ffaa66; }
        .line-color.battle { background: #ff5e5e; box-shadow: 0 0 4px #ff5e5e; }
        .line-color.patrol { background: #5aa9dd; box-shadow: 0 0 4px #5aa9dd; }
        .badge {
            background: #1e2a3a;
            padding: 5px 14px;
            border-radius: 40px;
            color: #ffecb3;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ffaa55;
            margin-left: auto;
        }
        .speed-control {
            background: #1a2533;
            padding: 4px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }
        .speed-control button {
            background: #ffaa44;
            border: none;
            color: #1a1f2a;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .speed-control button:hover {
            background: #ffcc66;
            transform: scale(1.02);
        }
        .speed-control span {
            color: #ffaa66;
            font-weight: bold;
        }
        .leaflet-popup-content-wrapper {
            background: #1e2a36;
            border-left: 4px solid #ffaa44;
            border-radius: 12px;
        }
        .leaflet-popup-content {
            color: #eef2ff;
            font-size: 13px;
        }
        .ship-marker-moving {
            background: transparent;
            border: none;
            transition: all 0.05s linear;
        }
        @keyframes shipPulse {
            0% { filter: drop-shadow(0 0 2px #ffaa44); transform: scale(1); }
            100% { filter: drop-shadow(0 0 8px #ffaa66); transform: scale(1.05); }
        }
        .ship-icon {
            animation: shipPulse 1.5s infinite alternate;
        }
    </style>
</head>
<body>
<div class="map-container">
    <div id="map"></div>
    <div class="legend-bar">
        <div class="legend-item"><span class="line-color convoy"></span> Маршруты конвоев</div>
        <div class="legend-item"><span class="line-color battle"></span> Боевые походы</div>
        <div class="legend-item"><span class="line-color patrol"></span> Патрули СФ</div>
        <div class="speed-control">
            <span>⚡ Скорость анимации:</span>
            <button id="speedDown">-</button>
            <span id="speedValue">1.0x</span>
            <button id="speedUp">+</button>
        </div>
        <div class="badge"><i>⚓</i> 1941–1945 · Северный флот</div>
    </div>
</div>

<script>
    (function() {
        // ========== ИНИЦИАЛИЗАЦИЯ КАРТЫ ==========
        const map = L.map('map', {
            center: [69.05, 35.6],
            zoom: 7,
            zoomControl: true,
            fadeAnimation: true
        });
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CartoDB',
            subdomains: 'abcd',
            maxZoom: 12
        }).addTo(map);
        
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let animationSpeed = 1.0;
        let activeAnimations = [];
        
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function formatPopup(title, desc, extra = '') {
            return `<strong style="color:#ffcd7e;">${title}</strong><br>${desc}${extra ? '<br><span style="color:#aac7e0;">' + extra + '</span>' : ''}`;
        }
        
        // Добавление маркеров баз
        function addBaseMarker(lat, lng, title, desc) {
            const icon = L.divIcon({
                html: `<div style="background:#d98f2b; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #ffdd99; box-shadow:0 0 12px #ffb347;"><span style="font-size:15px;">⚓</span></div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            L.marker([lat, lng], { icon }).addTo(map).bindPopup(formatPopup(title, desc, 'База СФ'));
        }
        
        // ========== ОСНОВНАЯ ФУНКЦИЯ АНИМАЦИИ КОРАБЛЕЙ ==========
        class AnimatedShip {
            constructor(points, options) {
                this.points = points;
                this.shipSymbol = options.shipSymbol || '🚢';
                this.shipName = options.shipName || 'Корабль';
                this.color = options.color || '#ffaa44';
                this.speed = options.speed || 0.002; // базовое смещение за кадр
                this.lineWeight = options.lineWeight || 3;
                this.dashArray = options.dashArray || null;
                this.popupText = options.popupText || '';
                this.marker = null;
                this.progress = Math.random(); // случайная начальная позиция
                this.active = true;
                
                // Рисуем линию маршрута
                this.polyline = L.polyline(points, {
                    color: this.color,
                    weight: this.lineWeight,
                    opacity: 0.7,
                    dashArray: this.dashArray,
                    lineCap: 'round'
                }).addTo(map);
                
                if (this.popupText) {
                    this.polyline.bindPopup(this.popupText);
                }
                
                // Создаём маркер корабля
                this.updateMarker();
            }
            
            getPositionAtProgress(progress) {
                if (progress >= 1) return this.points[this.points.length - 1];
                if (progress <= 0) return this.points[0];
                
                const totalSegments = this.points.length - 1;
                const segmentProgress = progress * totalSegments;
                const segmentIndex = Math.floor(segmentProgress);
                const segmentT = segmentProgress - segmentIndex;
                
                if (segmentIndex >= totalSegments) return this.points[totalSegments];
                
                const p1 = this.points[segmentIndex];
                const p2 = this.points[segmentIndex + 1];
                
                return [
                    p1[0] + (p2[0] - p1[0]) * segmentT,
                    p1[1] + (p2[1] - p1[1]) * segmentT
                ];
            }
            
            updateMarker() {
                const pos = this.getPositionAtProgress(this.progress);
                if (!pos) return;
                
                const icon = L.divIcon({
                    html: `<div style="font-size: 26px; filter: drop-shadow(0 0 5px ${this.color}); text-shadow: 0 0 3px black; animation: shipPulse 1s infinite alternate;">${this.shipSymbol}</div>`,
                    className: 'ship-marker-moving',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });
                
                if (this.marker) {
                    this.marker.setLatLng(pos);
                    this.marker.setIcon(icon);
                } else {
                    this.marker = L.marker(pos, { icon }).addTo(map);
                    this.marker.bindPopup(formatPopup(this.shipName, `Маршрут: ${this.popupText || 'боевое патрулирование'}`, 'в движении'));
                }
            }
            
            update(deltaSpeed) {
                if (!this.active) return;
                this.progress += this.speed * deltaSpeed;
                if (this.progress >= 1) {
                    this.progress = 0; // цикличное движение
                }
                this.updateMarker();
            }
            
            remove() {
                this.active = false;
                if (this.marker) map.removeLayer(this.marker);
                if (this.polyline) map.removeLayer(this.polyline);
            }
        }
        
        // ========== ДОБАВЛЕНИЕ БАЗ ==========
        addBaseMarker(69.025, 33.069, 'Полярный', 'Главная база Северного флота');
        addBaseMarker(69.083, 33.416, 'Североморск (Ваенга)', 'Штаб флота, аэродром');
        addBaseMarker(68.970, 33.075, 'Мурманск', 'Город-герой, порт приёма конвоев');
        addBaseMarker(69.200, 33.450, 'Гремиха', 'База подлодок');
        addBaseMarker(66.550, 33.100, 'Кандалакша', 'Тыловой порт');
        
        // ========== СОЗДАНИЕ АНИМИРОВАННЫХ КОРАБЛЕЙ ПО МАРШРУТАМ ==========
        
        const ships = [];
        
        // 1. Конвой PQ-12/QP-8 - грузовое судно
        ships.push(new AnimatedShip([
            [74.5, 19.0], [72.2, 27.5], [70.5, 33.0], [69.2, 35.2]
        ], {
            shipSymbol: '🛳️',
            shipName: 'Транспорт "Ланкастер"',
            color: '#ffaa44',
            speed: 0.0015,
            lineWeight: 4,
            dashArray: '10, 8',
            popupText: 'Конвой PQ-12 (март 1942) · доставка грузов в Мурманск'
        }));
        
        // 2. Конвой PQ-17 - исторический трагический маршрут
        ships.push(new AnimatedShip([
            [74.5, 18.0], [73.2, 28.5], [71.5, 42.0], [68.8, 47.5]
        ], {
            shipSymbol: '⚓',
            shipName: 'Транспорт "Ocean Voice"',
            color: '#ffaa66',
            speed: 0.0012,
            lineWeight: 4,
            dashArray: '12, 10',
            popupText: 'PQ-17 (июль 1942) · трагедия конвоя'
        }));
        
        // 3. Прямой маршрут к Мурманску
        ships.push(new AnimatedShip([
            [72.0, 30.5], [69.8, 33.2], [69.2, 34.0]
        ], {
            shipSymbol: '🚢',
            shipName: 'Союзный конвой JW-55',
            color: '#ffbb66',
            speed: 0.0018,
            lineWeight: 3.5,
            dashArray: '10, 8',
            popupText: 'Маршрут конвоев из Исландии'
        }));
        
        // 4. Северный маршрут (JW/RA)
        ships.push(new AnimatedShip([
            [71.2, 24.0], [70.5, 29.0], [69.4, 34.5]
        ], {
            shipSymbol: '⛴️',
            shipName: 'Танкер "British Pride"',
            color: '#ffaa77',
            speed: 0.0014,
            lineWeight: 3.5,
            dashArray: '12, 12',
            popupText: 'Конвой RA-55A · обратный путь'
        }));
        
        // 5. Эсминец "Гремящий" - боевой поход
        ships.push(new AnimatedShip([
            [69.5, 33.0], [71.2, 31.5], [72.0, 28.5]
        ], {
            shipSymbol: '⛴️',
            shipName: 'Эсминец "Гремящий"',
            color: '#ff5e5e',
            speed: 0.0022,
            lineWeight: 5,
            dashArray: null,
            popupText: 'Боевой поход · атака на вражеский конвой (апрель 1942)'
        }));
        
        // 6. Подводная лодка К-21 (Лунин)
        ships.push(new AnimatedShip([
            [69.2, 33.5], [71.0, 27.2], [72.3, 21.8]
        ], {
            shipSymbol: '🐋',
            shipName: 'ПЛ К-21 (капитан Лунин)',
            color: '#ff6b6b',
            speed: 0.0019,
            lineWeight: 4.5,
            dashArray: null,
            popupText: 'Торпедная атака на линкор "Тирпиц" · 5 июля 1942'
        }));
        
        // 7. Сторожевой корабль - патруль вдоль побережья
        ships.push(new AnimatedShip([
            [69.4, 33.8], [68.8, 37.5], [68.1, 39.5], [67.4, 41.2]
        ], {
            shipSymbol: '⛴️',
            shipName: 'СКР "Смерч"',
            color: '#5aa9dd',
            speed: 0.0016,
            lineWeight: 3,
            dashArray: '6, 8',
            popupText: 'Противолодочный дозор · 1943-1944'
        }));
        
        // 8. Патруль в Баренцевом море
        ships.push(new AnimatedShip([
            [69.3, 34.0], [70.5, 36.0], [71.8, 38.0]
        ], {
            shipSymbol: '⛴️',
            shipName: 'Сторожевик "Буран"',
            color: '#5aa9dd',
            speed: 0.0017,
            lineWeight: 3,
            dashArray: '6, 8',
            popupText: 'Поиск подлодок противника'
        }));
        
        // 9. Тральщики Беломорской флотилии
        ships.push(new AnimatedShip([
            [67.5, 43.0], [66.8, 44.5], [66.0, 43.0]
        ], {
            shipSymbol: '⚓',
            shipName: 'Тральщик Т-117',
            color: '#6cace4',
            speed: 0.0013,
            lineWeight: 3,
            dashArray: '5, 7',
            popupText: 'Патруль Беломорской флотилии'
        }));
        
        // 10. Быстроходный катер связи (дополнительный маршрут)
        ships.push(new AnimatedShip([
            [69.15, 33.3], [69.25, 34.2], [69.2, 35.0], [68.95, 34.5], [69.05, 33.9]
        ], {
            shipSymbol: '⛴️',
            shipName: 'Торпедный катер ТКА-12',
            color: '#88ccff',
            speed: 0.0025,
            lineWeight: 2.5,
            dashArray: '4, 10',
            popupText: 'Связной катер · доставка донесений'
        }));
        
        // 11. Атака на PQ-13 - эсминец
        ships.push(new AnimatedShip([
            [71.0, 32.5], [70.2, 35.2], [69.5, 34.3]
        ], {
            shipSymbol: '⛴️',
            shipName: 'Эсминец "Сокрушительный"',
            color: '#ff5252',
            speed: 0.0020,
            lineWeight: 4,
            dashArray: null,
            popupText: 'Атака на PQ-13 (март 1942)'
        }));
        
        // 12. Госпитальное судно
        ships.push(new AnimatedShip([
            [68.2, 39.0], [67.5, 41.0], [66.8, 42.5]
        ], {
            shipSymbol: '🏥',
            shipName: 'Госпитальное судно "Антон Чехов"',
            color: '#f4a261',
            speed: 0.0011,
            lineWeight: 3,
            dashArray: '8, 8',
            popupText: 'Эвакуация раненых'
        }));
        
        // ========== ДОПОЛНИТЕЛЬНЫЕ МАРКЕРЫ СОБЫТИЙ ==========
        const eventIcon = L.divIcon({
            html: `<div style="background:#e34d4d; width:14px; height:14px; border-radius:14px; border:2px solid white; box-shadow:0 0 10px red;"></div>`,
            iconSize: [14, 14]
        });
        
        L.marker([71.5, 28.0], { icon: eventIcon }).addTo(map)
            .bindPopup(formatPopup('Бой с эсминцами', 'Потоплен транспорт "Кведлинбург" (май 1942)'));
        L.marker([72.2, 24.5], { icon: eventIcon }).addTo(map)
            .bindPopup(formatPopup('Атака К-21', 'Торпедная атака по линкору "Тирпиц"', '5 июля 1942'));
        L.marker([69.335, 34.105], { icon: L.divIcon({ html: '🏝️', iconSize: [24, 24] }) }).addTo(map)
            .bindPopup(formatPopup('о. Кильдин', 'Гарнизон, береговые батареи'));
        
        // ========== АНИМАЦИОННЫЙ ЦИКЛ ==========
        let lastTimestamp = 0;
        let animationId = null;
        
        function animateShips(currentTime) {
            if (!lastTimestamp) {
                lastTimestamp = currentTime;
                animationId = requestAnimationFrame(animateShips);
                return;
            }
            
            const delta = Math.min(0.05, (currentTime - lastTimestamp) / 1000);
            if (delta > 0) {
                const speedFactor = animationSpeed * 60 * delta; // нормализация скорости
                ships.forEach(ship => {
                    if (ship.active) {
                        ship.update(speedFactor);
                    }
                });
            }
            
            lastTimestamp = currentTime;
            animationId = requestAnimationFrame(animateShips);
        }
        
        // Запуск анимации
        animateShips(0);
        
        // ========== УПРАВЛЕНИЕ СКОРОСТЬЮ ==========
        const speedDownBtn = document.getElementById('speedDown');
        const speedUpBtn = document.getElementById('speedUp');
        const speedValueSpan = document.getElementById('speedValue');
        
        speedDownBtn.addEventListener('click', () => {
            animationSpeed = Math.max(0.3, animationSpeed - 0.1);
            speedValueSpan.textContent = animationSpeed.toFixed(1) + 'x';
        });
        
        speedUpBtn.addEventListener('click', () => {
            animationSpeed = Math.min(2.5, animationSpeed + 0.1);
            speedValueSpan.textContent = animationSpeed.toFixed(1) + 'x';
        });
        
        // ========== МИГАЮЩИЕ МАРКЕРЫ ДЛЯ АКТИВНЫХ ЗОН ==========
        const blinkPoints = [
            { lat: 69.33, lng: 34.10, title: 'Кольский залив', desc: 'Главная база СФ' },
            { lat: 71.9, lng: 29.5, title: 'Район атаки Тирпица', desc: 'Активные боевые действия' },
            { lat: 69.95, lng: 32.8, title: 'Авиаразведка СФ', desc: 'Постоянное патрулирование' }
        ];
        
        blinkPoints.forEach(p => {
            const marker = L.circleMarker([p.lat, p.lng], {
                radius: 8,
                color: '#ffaa66',
                weight: 2,
                fillColor: '#ff6644',
                fillOpacity: 0.6
            }).addTo(map).bindPopup(formatPopup(p.title, p.desc, 'активная зона'));
            
            let blinkState = true;
            setInterval(() => {
                blinkState = !blinkState;
                marker.setStyle({
                    fillOpacity: blinkState ? 0.8 : 0.2,
                    radius: blinkState ? 9 : 6,
                    color: blinkState ? '#ffaa77' : '#ff8866'
                });
            }, 700);
        });
        
        // ========== ТЕКСТОВАЯ МЕТКА ==========
        const textIcon = L.divIcon({
            html: '<div style="background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); color:#ffecb3; padding:6px 16px; border-radius:32px; font-weight:bold; border:1px solid #ffbb77;">⚓ Кольский полуостров · Северный флот</div>',
            iconSize: [220, 36],
            iconAnchor: [110, 18]
        });
        L.marker([67.8, 36.0], { icon: textIcon, interactive: false }).addTo(map);
        
        // Масштаб
        L.control.scale({ imperial: false, metric: true, position: 'bottomright' }).addTo(map);
        
        // Акватории
        L.circle([69.2, 34.8], {
            color: '#ffbb66',
            weight: 1.5,
            fillColor: '#335588',
            fillOpacity: 0.12,
            radius: 50000
        }).addTo(map).bindPopup('Кольский залив — главная база СФ');
        
        L.circle([71.2, 28.5], {
            color: '#ff8855',
            weight: 1,
            fillColor: '#446688',
            fillOpacity: 0.08,
            radius: 70000
        }).addTo(map).bindPopup('Район активных конвойных операций');
        
        // Стили
        const style = document.createElement('style');
        style.textContent = `
            .leaflet-container { background: #0a1020; }
            .leaflet-control-scale-line { background: #10161ecc; color: #ddd; border-color: #ffbb77; }
            .leaflet-popup-content-wrapper { background: #1e2a36; border-left: 3px solid #ffaa44; border-radius: 12px; }
        `;
        document.head.appendChild(style);
        
        console.log(`Анимация запущена: ${ships.length} кораблей в движении`);
        
        // Информация на карте
        const infoControl = L.control({ position: 'topright' });
        infoControl.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.innerHTML = '<div style="background:#0f1722cc; padding:6px 12px; border-radius:20px; font-size:11px; color:#ffefcf; backdrop-filter:blur(6px);">🚢 ' + ships.length + ' кораблей в движении</div>';
            return div;
        };
        infoControl.addTo(map);
        
        setTimeout(() => map.invalidateSize(), 100);
    })();
</script>
</body>
</html>
